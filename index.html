  "about": { "@type": "Place", "name": "Județul Iași", "address": { "@type": "PostalAddress", "addressRegion": "Iași", "addressCountry": "RO" } }
}
</script>
</head>
<body>

<a class="sari-la-continut" href="#harta">Sari la hartă</a>

<div id="aplicatie">
  <aside id="bara">
    <header id="antet">
      <h1>Patrimoniul județului Iași</h1>
      <p>Instrument de lucru pentru strategia de turism</p>
    </header>

    <nav class="navigare" aria-label="Secțiuni">
      <a href="index.html" aria-current="page">Hartă</a>
      <a href="evenimente.html">Calendar</a>
      <a href="despre.html">Despre</a>
    </nav>

    <div id="unelte">
      <label class="sari-la-continut" for="cautare">Caută</label>
      <input id="cautare" type="search" placeholder="Caută după denumire sau comună" autocomplete="off">
      <div class="rand-unelte">
        <select id="fundal" aria-label="Fundal de hartă"></select>
        <button class="buton" id="reincarca">Reîncarcă datele</button>
      </div>
    </div>

    <div id="filtre"></div>

    <div id="subsol">
      <span><strong id="nr-vizibile">0</strong> obiective afișate</span>
      <span id="moment"></span>
    </div>
  </aside>

  <main id="harta" aria-label="Hartă interactivă"></main>
</div>

<div id="stare" role="status">Se încarcă datele…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="config.js?v=5"></script>
<script>

function mesaj(text, esteEroare){
  const cutie = document.getElementById('stare');
  if (!text){ cutie.classList.add('ascuns'); return; }
  cutie.classList.remove('ascuns');
  cutie.classList.toggle('eroare', !!esteEroare);
  cutie.innerHTML = text;
}

/* ---------- harta ---------- */

const harta = L.map('harta', { zoomControl:false }).setView(CONFIG.centru, CONFIG.zoom);
L.control.zoom({ position:'bottomright' }).addTo(harta);
L.control.scale({ imperial:false, position:'bottomleft' }).addTo(harta);

const FUNDALURI = {
  gri: { eticheta:'Fundal deschis', strat: L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap', maxZoom:16 }) },
  osm: { eticheta:'OpenStreetMap', strat: L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19 }) },
  relief: { eticheta:'Relief', strat: L.tileLayer(
    'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    { attribution:'&copy; OpenStreetMap, SRTM, OpenTopoMap', maxZoom:17 }) }
};

if (CONFIG.cheieCarto){
  FUNDALURI.carto = { eticheta:'CARTO Positron', strat: L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(CONFIG.cheieCarto)}`,
    { attribution:'&copy; OpenStreetMap, &copy; CARTO', subdomains:'abcd', maxZoom:20 }) };
}

const selectFundal = document.getElementById('fundal');
selectFundal.innerHTML = Object.entries(FUNDALURI)
  .map(([k,f]) => `<option value="${k}">${f.eticheta}</option>`).join('');
let fundalCurent = (FUNDALURI.carto || FUNDALURI.gri).strat.addTo(harta);
selectFundal.value = FUNDALURI.carto ? 'carto' : 'gri';
selectFundal.addEventListener('change', e => {
  harta.removeLayer(fundalCurent);
  fundalCurent = FUNDALURI[e.target.value].strat.addTo(harta);
});

const stratPuncte = L.layerGroup().addTo(harta);

/* ---------- stare ---------- */

const stare = { randuri:[], arbore:new Map(), active:new Set(), cautare:'' };

/* ---------- popup ---------- */

function detaliuHtml(r){
  const culoare = culoareCategorie(r._categorie);
  const parti = [`<div class="pop" style="--c:${culoare}">`];
  parti.push(`<div class="pop-eticheta"><i></i>${esc(r._subcategorie)}</div>`);
  parti.push(`<h3>${esc(r[COL.denumire])}</h3>`);
  if (r[COL.uat]) parti.push(`<p class="pop-uat">${esc(r[COL.uat])}</p>`);
  if (r[COL.foto])
    parti.push(`<img src="${esc(r[COL.foto])}" alt="Fotografie: ${esc(r[COL.denumire])}, ${esc(r[COL.uat] || 'județul Iași')}" loading="lazy" onerror="this.remove()">`);

  const descriere = r[COL.detalii] || r[COL.descriere];
  if (descriere) parti.push(`<p>${esc(descriere)}</p>`);

  const detalii = [];
  if (r._perioada)      detalii.push(`<dt>Perioada</dt><dd>${esc(formateazaPerioada(r._perioada))}</dd>`);
  if (r[COL.program])   detalii.push(`<dt>Program</dt><dd>${esc(r[COL.program])}</dd>`);
  if (r[COL.web])       detalii.push(`<dt>Web</dt><dd><a href="${esc(r[COL.web])}" target="_blank" rel="noopener">pagina oficială</a></dd>`);
  if (r[COL.sursa])     detalii.push(`<dt>Sursa</dt><dd>${esc(r[COL.sursa])}</dd>`);
  if (detalii.length) parti.push(`<dl>${detalii.join('')}</dl>`);

  parti.push('</div>');
  return parti.join('');
}

// Construiește conținutul popup-ului pentru un grup de obiective aflate
// la aceleași coordonate. Cu un singur obiectiv arată direct detaliul.
function creeazaContinut(lista, marcator){
  const gazda = document.createElement('div');

  // La prima construcție, Leaflet desenează el conținutul. Dacă am cere
  // atunci o redesenare, funcția s-ar apela pe ea însăși la nesfârșit.
  let construit = false;

  function reimprospateaza(){
    if (!construit) return;
    const popup = marcator.getPopup();
    if (popup && popup.isOpen()) popup.update();
  }

  function aratLista(){
    gazda.innerHTML = '';

    const cap = document.createElement('div');
    cap.className = 'pop-cap';
    cap.textContent = `${lista.length} obiective la aceeași locație`;
    gazda.appendChild(cap);

    const ul = document.createElement('ul');
    ul.className = 'pop-lista';
    lista.forEach((r, i) => {
      const li = document.createElement('li');
      const buton = document.createElement('button');
      buton.type = 'button';
      buton.innerHTML =
        `<span class="pastila-mica" style="background:${culoareCategorie(r._categorie)}"></span>
         <span><strong>${esc(r[COL.denumire])}</strong><em>${esc(r._subcategorie)}</em></span>`;
      buton.addEventListener('click', () => aratDetaliu(i));
      li.appendChild(buton);
      ul.appendChild(li);
    });
    gazda.appendChild(ul);
    reimprospateaza();
  }

  function aratDetaliu(i){
    gazda.innerHTML = '';
    if (lista.length > 1){
      const inapoi = document.createElement('button');
      inapoi.type = 'button';
      inapoi.className = 'pop-inapoi';
      inapoi.textContent = `Înapoi la cele ${lista.length} obiective`;
      inapoi.addEventListener('click', aratLista);
      gazda.appendChild(inapoi);
    }
    const corp = document.createElement('div');
    corp.innerHTML = detaliuHtml(lista[i]);
    gazda.appendChild(corp);
    reimprospateaza();
  }

  lista.length === 1 ? aratDetaliu(0) : aratLista();
  construit = true;
  return gazda;
}

function creeazaMarcator(lista){
  const r = lista[0];
  const culoare = culoareCategorie(r._categorie);
  const insigna = lista.length > 1 ? `<span class="insigna">${lista.length}</span>` : '';
  const titlu = lista.length > 1
    ? `${lista.length} obiective la aceeași locație`
    : (r[COL.denumire] || '');

  const marcator = L.marker([r._lat, r._lon], {
    icon: L.divIcon({
      className:'ancora-pin',
      html:`<span class="pin" style="--c:${culoare}"></span>${insigna}`,
      iconSize:[15,15], iconAnchor:[7.5,7.5], popupAnchor:[0,-9]
    }),
    title: titlu,
    riseOnHover: true,
    alt: titlu
  });

  marcator.bindPopup(() => creeazaContinut(lista, marcator),
                     { maxWidth:300, minWidth:280, autoPanPadding:[30,30] });
  return marcator;
}

/* ---------- filtre ---------- */

function deseneazaFiltre(){
  const gazda = document.getElementById('filtre');
  gazda.innerHTML = '';

  const ordonate = [];
  CATEGORII.forEach(c => {
    for (const cheie of stare.arbore.keys())
      if (fara(cheie) === fara(c.cheie)) ordonate.push(cheie);
  });
  for (const cheie of stare.arbore.keys())
    if (!ordonate.includes(cheie)) ordonate.push(cheie);

  ordonate.forEach(categorie => {
    const subcategorii = [...stare.arbore.get(categorie).entries()].sort((a,b) => cmp(a[0], b[0]));
    const total = subcategorii.reduce((s,[,n]) => s + n, 0);

    const bloc = document.createElement('div');
    bloc.className = 'categorie';

    const cap = document.createElement('label');
    cap.className = 'cap-categorie';
    cap.innerHTML =
      `<input type="checkbox" checked>
       <span class="pastila" style="background:${culoareCategorie(categorie)}"></span>
       <span class="nume-categorie">${esc(etichetaCategorie(categorie))}</span>
       <span class="numar">${total}</span>`;
    bloc.appendChild(cap);

    const lista = document.createElement('div');
    lista.className = 'subcategorii';
    const bifeSub = [];

    subcategorii.forEach(([subcategorie, cate]) => {
      const cheie = fara(categorie) + '||' + fara(subcategorie);
      const rand = document.createElement('label');
      rand.className = 'subcategorie';
      rand.innerHTML =
        `<input type="checkbox" checked>
         <span>${esc(subcategorie)}</span>
         <span class="numar">${cate}</span>`;
      const bifa = rand.querySelector('input');
      bifa.dataset.cheie = cheie;
      bifa.addEventListener('change', () => {
        bifa.checked ? stare.active.add(cheie) : stare.active.delete(cheie);
        actualizeazaCap();
        aplicaFiltre();
      });
      bifeSub.push(bifa);
      lista.appendChild(rand);
    });

    const bifaCap = cap.querySelector('input');
    function actualizeazaCap(){
      const bifate = bifeSub.filter(b => b.checked).length;
      bifaCap.checked = bifate === bifeSub.length;
      bifaCap.indeterminate = bifate > 0 && bifate < bifeSub.length;
    }
    bifaCap.addEventListener('change', () => {
      bifeSub.forEach(b => {
        b.checked = bifaCap.checked;
        b.checked ? stare.active.add(b.dataset.cheie) : stare.active.delete(b.dataset.cheie);
      });
      bifaCap.indeterminate = false;
      aplicaFiltre();
    });

    bloc.appendChild(lista);
    gazda.appendChild(bloc);
  });
}

function aplicaFiltre(incadreaza){
  stratPuncte.clearLayers();

  // Grupăm obiectivele vizibile după coordonate, ca să nu se ascundă unele pe altele
  const grupuri = new Map();
  stare.randuri.forEach(r => {
    if (!stare.active.has(r._cheie)) return;
    if (stare.cautare && !r._text.includes(stare.cautare)) return;
    if (!grupuri.has(r._coord)) grupuri.set(r._coord, []);
    grupuri.get(r._coord).push(r);
  });

  let vizibile = 0;
  const limite = [];
  grupuri.forEach(lista => {
    const marcator = creeazaMarcator(lista);
    stratPuncte.addLayer(marcator);
    limite.push(marcator.getLatLng());
    vizibile += lista.length;
  });

  document.getElementById('nr-vizibile').textContent = vizibile;
  if (incadreaza && limite.length)
    harta.fitBounds(L.latLngBounds(limite), { padding:[40,40], maxZoom:11 });
}

document.getElementById('cautare').addEventListener('input', e => {
  stare.cautare = fara(e.target.value);
  aplicaFiltre();
});
document.getElementById('reincarca').addEventListener('click', porneste);

/* ---------- contururi ---------- */

async function incarcaPoligoane(){
  for (const strat of CONFIG.poligoane){
    try {
      const raspuns = await fetch(strat.fisier);
      if (!raspuns.ok) continue;
      const geojson = await raspuns.json();
      const layer = L.geoJSON(geojson, {
        style: { color:strat.culoare, weight:1.5, fillColor:strat.culoare, fillOpacity:.14 },
        onEachFeature: (f, l) => {
          const p = f.properties || {};
          const nume = p.nume || p.name || p.SITENAME || strat.eticheta;
          l.bindPopup(`<div class="pop" style="--c:${strat.culoare}">
            <div class="pop-eticheta"><i></i>${esc(strat.eticheta)}</div>
            <h3>${esc(nume)}</h3></div>`);
        }
      }).addTo(harta);
      adaugaComutatorPoligon(strat, layer);
    } catch (err){ /* fișier absent */ }
  }
}

function adaugaComutatorPoligon(strat, layer){
  let bloc = document.getElementById('bloc-contururi');
  if (!bloc){
    bloc = document.createElement('div');
    bloc.id = 'bloc-contururi';
    bloc.className = 'categorie';
    bloc.innerHTML = `<div class="cap-categorie" style="cursor:default">
        <span class="pastila" style="background:transparent;border:1.5px dashed #7E7568"></span>
        <span class="nume-categorie">Contururi</span></div>
      <div class="subcategorii"></div>`;
    document.getElementById('filtre').appendChild(bloc);
  }
  const rand = document.createElement('label');
  rand.className = 'subcategorie';
  rand.innerHTML = `<input type="checkbox" checked><span>${esc(strat.eticheta)}</span>`;
  rand.querySelector('input').addEventListener('change', e => {
    e.target.checked ? layer.addTo(harta) : harta.removeLayer(layer);
  });
  bloc.querySelector('.subcategorii').appendChild(rand);
}

/* ---------- pornire ---------- */

async function porneste(){
  mesaj('Se încarcă datele…');
  let rezultat;
  try {
    rezultat = await incarcaDate();
  } catch (err){
    mesaj(eroareIncarcare(err), true);
    return;
  }

  stare.randuri = rezultat.randuri;
  stare.arbore = new Map();
  stare.active = new Set();

  stare.randuri.forEach(r => {
    if (!stare.arbore.has(r._categorie)) stare.arbore.set(r._categorie, new Map());
    const sub = stare.arbore.get(r._categorie);
    sub.set(r._subcategorie, (sub.get(r._subcategorie) || 0) + 1);
    stare.active.add(r._cheie);
  });

  deseneazaFiltre();
  aplicaFiltre(true);

  document.getElementById('moment').textContent =
    `${rezultat.sursa}, ${new Date().toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'})}`;

  if (rezultat.faraCoordonate > 0){
    mesaj(`${rezultat.faraCoordonate} rânduri au fost ignorate pentru că nu au coordonate valide.`, true);
    setTimeout(() => mesaj(''), 9000);
  } else {
    mesaj('');
  }
}

porneste().then(incarcaPoligoane);
</script>
</body>
</html>
