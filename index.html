<script>

function mesaj(text, esteEroare){
  const cutie = document.getElementById('stare');
  if (!text){ cutie.classList.add('ascuns'); return; }
  cutie.classList.remove('ascuns');
  cutie.classList.toggle('eroare', !!esteEroare);
  cutie.innerHTML = text;
}

/* ---------- harta ---------- */

const harta = L.map('harta', { zoomControl:false }).setView(CONFIG.centru, CONFIG.zoom);
L.control.zoom({ position:'bottomright' }).addTo(harta);
L.control.scale({ imperial:false, position:'bottomleft' }).addTo(harta);

const FUNDALURI = {
  gri: { eticheta:'Fundal deschis', strat: L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    { attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap', maxZoom:16 }) },
  osm: { eticheta:'OpenStreetMap', strat: L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19 }) },
  relief: { eticheta:'Relief', strat: L.tileLayer(
    'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    { attribution:'&copy; OpenStreetMap, SRTM, OpenTopoMap', maxZoom:17 }) }
};

if (CONFIG.cheieCarto){
  FUNDALURI.carto = { eticheta:'CARTO Positron', strat: L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(CONFIG.cheieCarto)}`,
    { attribution:'&copy; OpenStreetMap, &copy; CARTO', subdomains:'abcd', maxZoom:20 }) };
}

const selectFundal = document.getElementById('fundal');
selectFundal.innerHTML = Object.entries(FUNDALURI)
  .map(([k,f]) => `<option value="${k}">${f.eticheta}</option>`).join('');
let fundalCurent = (FUNDALURI.carto || FUNDALURI.gri).strat.addTo(harta);
selectFundal.value = FUNDALURI.carto ? 'carto' : 'gri';
selectFundal.addEventListener('change', e => {
  harta.removeLayer(fundalCurent);
  fundalCurent = FUNDALURI[e.target.value].strat.addTo(harta);
});

const stratPuncte  = L.layerGroup().addTo(harta);
const stratOrase   = L.layerGroup().addTo(harta);
const stratUAT     = L.layerGroup().addTo(harta);

/* ---------- stare ---------- */

const stare = {
  randuri:[], arbore:new Map(), active:new Set(), cautare:'',
  inUAT:false, limiteUAT:null, limiteJudet:null
};

/* ---------- etichete de localități ---------- */

function deseneazaOrase(){
  (CONFIG.orase || []).forEach(o => {
    L.marker([o.lat, o.lon], {
      icon: L.divIcon({
        className:'eticheta-oras',
        html:`<span>${esc(o.nume)}</span>`,
        iconSize:[0,0], iconAnchor:[0,6]
      }),
      interactive:false,
      keyboard:false
    }).addTo(stratOrase);
  });
}

/* ---------- popup ---------- */

function detaliuHtml(r){
  const culoare = culoareCategorie(r._categorie);
  const parti = [`<div class="pop" style="--c:${culoare}">`];
  parti.push(`<div class="pop-eticheta"><i></i>${esc(r._subcategorie)}</div>`);
  parti.push(`<h3>${esc(r[COL.denumire])}</h3>`);
  if (r[COL.uat]) parti.push(`<p class="pop-uat">${esc(r[COL.uat])}</p>`);
  if (r[COL.foto])
    parti.push(`<img src="${esc(r[COL.foto])}" alt="Fotografie: ${esc(r[COL.denumire])}, ${esc(r[COL.uat] || 'județul Iași')}" loading="lazy" onerror="this.remove()">`);

  const descriere = r[COL.detalii] || r[COL.descriere];
  if (descriere) parti.push(`<p>${esc(descriere)}</p>`);

  const detalii = [];
  if (r._perioada)    detalii.push(`<dt>Perioada</dt><dd>${esc(formateazaPerioada(r._perioada))}</dd>`);
  if (r[COL.program]) detalii.push(`<dt>Program</dt><dd>${esc(r[COL.program])}</dd>`);
  if (r[COL.web])     detalii.push(`<dt>Web</dt><dd><a href="${esc(r[COL.web])}" target="_blank" rel="noopener">pagina oficială</a></dd>`);
  if (detalii.length) parti.push(`<dl>${detalii.join('')}</dl>`);

  parti.push('</div>');
  return parti.join('');
}

function creeazaContinut(lista, marcator){
  const gazda = document.createElement('div');
  let construit = false;

  function reimprospateaza(){
    if (!construit) return;
    const popup = marcator.getPopup();
    if (popup && popup.isOpen()) popup.update();
  }

  function aratLista(){
    gazda.innerHTML = '';
    const cap = document.createElement('div');
    cap.className = 'pop-cap';
    cap.textContent = `${lista.length} obiective la aceeași locație`;
    gazda.appendChild(cap);

    const ul = document.createElement('ul');
    ul.className = 'pop-lista';
    lista.forEach((r, i) => {
      const li = document.createElement('li');
      const buton = document.createElement('button');
      buton.type = 'button';
      buton.innerHTML =
        `<span class="pastila-mica" style="background:${culoareCategorie(r._categorie)}"></span>
         <span><strong>${esc(r[COL.denumire])}</strong><em>${esc(r._subcategorie)}</em></span>`;
      buton.addEventListener('click', () => aratDetaliu(i));
      li.appendChild(buton);
      ul.appendChild(li);
    });
    gazda.appendChild(ul);
    reimprospateaza();
  }

  function aratDetaliu(i){
    gazda.innerHTML = '';
    if (lista.length > 1){
      const inapoi = document.createElement('button');
      inapoi.type = 'button';
      inapoi.className = 'pop-inapoi';
      inapoi.textContent = `Înapoi la cele ${lista.length} obiective`;
      inapoi.addEventListener('click', aratLista);
      gazda.appendChild(inapoi);
    }
    const corp = document.createElement('div');
    corp.innerHTML = detaliuHtml(lista[i]);
    gazda.appendChild(corp);
    reimprospateaza();
  }

  lista.length === 1 ? aratDetaliu(0) : aratLista();
  construit = true;
  return gazda;
}

function creeazaMarcator(lista){
  const r = lista[0];
  const culoare = culoareCategorie(r._categorie);
  const insigna = lista.length > 1 ? `<span class="insigna">${lista.length}</span>` : '';
  const titlu = lista.length > 1
    ? `${lista.length} obiective la aceeași locație`
    : (r[COL.denumire] || '');

  const marcator = L.marker([r._lat, r._lon], {
    icon: L.divIcon({
      className:'ancora-pin',
      html:`<span class="pin" style="--c:${culoare}"></span>${insigna}`,
      iconSize:[16,16], iconAnchor:[8,8], popupAnchor:[0,-10]
    }),
    title: titlu, alt: titlu, riseOnHover: true
  });

  marcator.bindPopup(() => creeazaContinut(lista, marcator),
                     { maxWidth:300, minWidth:286, autoPanPadding:[30,30] });

  // denumirea apare lângă punct de la un anumit nivel de zoom în sus;
  // sub prag o ascunde foaia de stil, ca să nu reconstruim marcatorii
  marcator.bindTooltip(titlu, {
    permanent:true, direction:'right', offset:[11,0],
    className:'eticheta-punct', opacity:1
  });
  return marcator;
}

function comutaEtichete(){
  const prag = CONFIG.zoomEtichete || 12;
  harta.getContainer().classList.toggle('fara-etichete', harta.getZoom() < prag);
}
harta.on('zoomend', comutaEtichete);

/* ---------- conturul UAT-ului separat ---------- */

async function deseneazaUAT(){
  const inauntru = stare.randuri.filter(r => r._separat);
  let geojson = null;

  try {
    const raspuns = await fetch(CONFIG.conturUAT);
    if (raspuns.ok) geojson = await raspuns.json();
  } catch (err){ /* fișierul lipsește, mergem pe forma aproximativă */ }

  const aproximativ = !geojson;
  if (!geojson) geojson = conturAproximativ(inauntru);
  if (!geojson) return;

  const strat = L.geoJSON(geojson, {
    className:'contur-uat',
    style:{ color:'#4A544F', weight:1.5, dashArray:'5 4',
            fillColor:'#4A544F', fillOpacity:.07 }
  }).addTo(stratUAT);

  stare.limiteUAT = strat.getBounds();

  const centru = stare.limiteUAT.getCenter();
  const eticheta = L.marker(centru, {
    icon: L.divIcon({
      className:'eticheta-uat',
      html:`<span>Municipiul Iași<small>${inauntru.length} obiective, apasă pentru a intra</small></span>`,
      iconSize:[0,0], iconAnchor:[0,0]
    }),
    interactive:false, keyboard:false
  }).addTo(stratUAT);

  strat.on('click', intraInUAT);
  strat.on('mouseover', () => strat.setStyle({ fillOpacity:.14 }));
  strat.on('mouseout',  () => strat.setStyle({ fillOpacity: stare.inUAT ? .04 : .07 }));

  stare._stratUAT = strat;
  stare._etichetaUAT = eticheta;

  if (aproximativ){
    console.info('Conturul municipiului Iași este aproximativ. ' +
                 'Adaugă fișierul ' + CONFIG.conturUAT + ' pentru limita reală.');
  }
}

function intraInUAT(){
  if (!stare.limiteUAT) return;
  stare.inUAT = true;
  document.getElementById('inapoi-judet').hidden = false;
  if (stare._etichetaUAT) stratUAT.removeLayer(stare._etichetaUAT);
  if (stare._stratUAT) stare._stratUAT.setStyle({ fillOpacity:.04, dashArray:'2 3' });
  aplicaFiltre();
  const potrivit = harta.getBoundsZoom(stare.limiteUAT, false, L.point(30,30));
  const tinta = Math.min(potrivit + (CONFIG.zoomInUAT || 0), harta.getMaxZoom() || 18);
  harta.flyTo(stare.limiteUAT.getCenter(), tinta, { duration:.7 });
}

function iesiDinUAT(){
  stare.inUAT = false;
  document.getElementById('inapoi-judet').hidden = true;
  if (stare._etichetaUAT) stratUAT.addLayer(stare._etichetaUAT);
  if (stare._stratUAT) stare._stratUAT.setStyle({ fillOpacity:.07, dashArray:'5 4' });
  aplicaFiltre();
  if (stare.limiteJudet) harta.flyToBounds(stare.limiteJudet, { padding:[40,40], maxZoom:11, duration:.7 });
}

document.getElementById('inapoi-judet').addEventListener('click', iesiDinUAT);

/* ---------- filtre ---------- */

// Cât e adevărat, bifele individuale nu redesenează harta: o face bifa de
// categorie, o singură dată, după ce le-a comutat pe toate.
let suspendat = false;

// Recalculează starea bifelor de categorie din bifele aflate sub ele
function sincronizeazaCapuri(){
  document.querySelectorAll('#filtre .categorie').forEach(bloc => {
    const cap = bloc.querySelector('input[data-cap]');
    if (!cap) return;
    const copii = [...bloc.querySelectorAll('.subcategorii input[type=checkbox]')];
    if (!copii.length) return;
    const bifate = copii.filter(b => b.checked).length;
    cap.checked = bifate === copii.length;
    cap.indeterminate = bifate > 0 && bifate < copii.length;
  });
}

function deseneazaFiltre(){
  const gazda = document.getElementById('filtre');
  gazda.innerHTML = '';

  const ordonate = [];
  CATEGORII.forEach(c => {
    for (const cheie of stare.arbore.keys())
      if (fara(cheie) === fara(c.cheie)) ordonate.push(cheie);
  });
  for (const cheie of stare.arbore.keys())
    if (!ordonate.includes(cheie)) ordonate.push(cheie);

  ordonate.forEach(categorie => {
    const subcategorii = [...stare.arbore.get(categorie).entries()].sort((a,b) => cmp(a[0], b[0]));
    const total = subcategorii.reduce((s,[,n]) => s + n, 0);

    const bloc = document.createElement('div');
    bloc.className = 'categorie';
    bloc.dataset.categorie = fara(categorie);

    const cap = document.createElement('label');
    cap.className = 'cap-categorie';
    cap.innerHTML =
      `<input type="checkbox" checked>
       <span class="nume-categorie" style="color:${culoareCategorie(categorie)}">${esc(etichetaCategorie(categorie))}</span>
       <span class="numar">${total}</span>`;
    bloc.appendChild(cap);

    const lista = document.createElement('div');
    lista.className = 'subcategorii';
    const bifeSub = [];

    subcategorii.forEach(([subcategorie, cate]) => {
      const cheie = fara(categorie) + '||' + fara(subcategorie);
      const rand = document.createElement('label');
      rand.className = 'subcategorie';
      rand.innerHTML =
        `<input type="checkbox" checked>
         <span>${esc(subcategorie)}</span>
         <span class="numar">${cate}</span>`;
      const bifa = rand.querySelector('input');
      bifa.dataset.cheie = cheie;
      bifa.addEventListener('change', () => {
        bifa.checked ? stare.active.add(cheie) : stare.active.delete(cheie);
        sincronizeazaCapuri();
        if (!suspendat) aplicaFiltre();
      });
      bifeSub.push(bifa);
      lista.appendChild(rand);
    });

    const bifaCap = cap.querySelector('input');
    bifaCap.dataset.cap = '1';

    // Bifa de categorie comandă tot ce se află sub ea, inclusiv straturile de
    // suprafețe adăugate ulterior. De aceea citim copiii la momentul apăsării,
    // nu la desenare, și le declanșăm propriile funcții prin evenimentul change.
    bifaCap.addEventListener('change', () => {
      suspendat = true;
      lista.querySelectorAll('input[type=checkbox]').forEach(b => {
        if (b.checked !== bifaCap.checked){
          b.checked = bifaCap.checked;
          b.dispatchEvent(new Event('change'));
        }
      });
      suspendat = false;
      bifaCap.indeterminate = false;
      aplicaFiltre();
    });

    bloc.appendChild(lista);
    gazda.appendChild(bloc);
  });

  poligoaneIncarcate.forEach(p => adaugaComutatorPoligon(p.strat, p.layer, p.numar));
  sincronizeazaCapuri();
}

function aplicaFiltre(incadreaza){
  stratPuncte.clearLayers();

  const grupuri = new Map();
  stare.randuri.forEach(r => {
    // punctele din UAT-ul separat apar doar după ce intri în el
    if (r._separat && !stare.inUAT) return;
    if (!stare.active.has(r._cheie)) return;
    if (stare.cautare && !r._text.includes(stare.cautare)) return;
    if (!grupuri.has(r._coord)) grupuri.set(r._coord, []);
    grupuri.get(r._coord).push(r);
  });

  let vizibile = 0;
  const limite = [];
  grupuri.forEach(lista => {
    const marcator = creeazaMarcator(lista);
    stratPuncte.addLayer(marcator);
    limite.push(marcator.getLatLng());
    vizibile += lista.length;
  });

  document.getElementById('nr-vizibile').textContent = vizibile;
  comutaEtichete();

  if (incadreaza && limite.length){
    stare.limiteJudet = L.latLngBounds(limite);
    harta.fitBounds(stare.limiteJudet, { padding:[40,40], maxZoom:11 });
  }
}

document.getElementById('cautare').addEventListener('input', e => {
  stare.cautare = fara(e.target.value);
  aplicaFiltre();
});
document.getElementById('reincarca').addEventListener('click', porneste);

/* ---------- contururi tematice ---------- */

const poligoaneIncarcate = [];

// Numele sub care poate veni denumirea entității din diverse surse
const CAMPURI_NUME = ['nume','denumire','name','SITENAME','SITE_NAME','NUME','DENUMIRE',
                      'Name','NAME','Denumire','Nume','nume_arie','DEN_ARIE','den_arie',
                      'NUMEUAT','nume_uat','TITLE','titlu'];

function numeEntitate(proprietati, implicit){
  if (!proprietati) return implicit;
  for (const c of CAMPURI_NUME){
    if (proprietati[c]) return proprietati[c];
  }
  return implicit;
}

async function incarcaPoligoane(){
  for (const strat of CONFIG.poligoane){
    try {
      const raspuns = await fetch(strat.fisier);
      if (!raspuns.ok) continue;
      const geojson = await raspuns.json();

      const layer = L.geoJSON(geojson, {
        style: { color:strat.culoare, weight:1.3, fillColor:strat.culoare, fillOpacity:.14 },
        onEachFeature: (f, l) => {
          const nume = numeEntitate(f.properties, strat.eticheta);
          l.bindPopup(`<div class="pop" style="--c:${strat.culoare}">
            <div class="pop-eticheta"><i></i>${esc(strat.eticheta)}</div>
            <h3>${esc(nume)}</h3></div>`, { maxWidth:300, minWidth:240 });
          l.bindTooltip(nume, { sticky:true, className:'eticheta-suprafata' });
          l.on('mouseover', () => l.setStyle({ fillOpacity:.3, weight:2 }));
          l.on('mouseout',  () => l.setStyle({ fillOpacity:.14, weight:1.3 }));
        },
        bubblingMouseEvents: false
      }).addTo(harta);

      const numar = (geojson.features || []).length || null;
      poligoaneIncarcate.push({ strat, layer, numar });
      adaugaComutatorPoligon(strat, layer, numar);
      sincronizeazaCapuri();
    } catch (err){ /* fișier absent sau JSON invalid */ }
  }
}

function adaugaComutatorPoligon(strat, layer, numar){
  const gazda = document.getElementById('filtre');

  // căutăm categoria în care ar trebui să stea; dacă lipsește, facem un bloc propriu
  let lista = null;
  if (strat.categorie){
    const bloc = gazda.querySelector(`.categorie[data-categorie="${fara(strat.categorie)}"]`);
    if (bloc) lista = bloc.querySelector('.subcategorii');
  }
  if (!lista){
    let bloc = document.getElementById('bloc-suprafete');
    if (!bloc){
      bloc = document.createElement('div');
      bloc.id = 'bloc-suprafete';
      bloc.className = 'categorie';
      bloc.innerHTML = `<div class="cap-categorie" style="cursor:default">
          <span class="nume-categorie">Suprafețe</span></div>
        <div class="subcategorii"></div>`;
      gazda.appendChild(bloc);
    }
    lista = bloc.querySelector('.subcategorii');
  }

  const pornit = harta.hasLayer(layer);
  const rand = document.createElement('label');
  rand.className = 'subcategorie';
  rand.innerHTML =
    `<input type="checkbox" ${pornit ? 'checked' : ''}>
     <span>${esc(strat.eticheta)}</span>
     <span class="numar">${numar || ''}</span>`;
  rand.querySelector('input').addEventListener('change', e => {
    e.target.checked ? layer.addTo(harta) : harta.removeLayer(layer);
    sincronizeazaCapuri();
  });
  lista.appendChild(rand);
}

/* ---------- pornire ---------- */

async function porneste(){
  mesaj('Se încarcă datele…');
  let rezultat;
  try {
    rezultat = await incarcaDate();
  } catch (err){
    mesaj(eroareIncarcare(err), true);
    return;
  }

  stare.randuri = rezultat.randuri;
  stare.arbore = new Map();
  stare.active = new Set();
  stare.inUAT = false;
  document.getElementById('inapoi-judet').hidden = true;

  stare.randuri.forEach(r => {
    if (!stare.arbore.has(r._categorie)) stare.arbore.set(r._categorie, new Map());
    const sub = stare.arbore.get(r._categorie);
    sub.set(r._subcategorie, (sub.get(r._subcategorie) || 0) + 1);
    stare.active.add(r._cheie);
  });

  deseneazaFiltre();
  aplicaFiltre(true);

  stratUAT.clearLayers();
  stratOrase.clearLayers();
  deseneazaOrase();
  await deseneazaUAT();

  document.getElementById('moment').textContent =
    `${rezultat.sursa}, ${new Date().toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'})}`;

  if (rezultat.faraCoordonate > 0){
    mesaj(`${rezultat.faraCoordonate} rânduri nu au coordonate valide și nu apar pe hartă.`, true);
    setTimeout(() => mesaj(''), 9000);
  } else {
    mesaj('');
  }
}

porneste().then(incarcaPoligoane);
</script>
</body>
