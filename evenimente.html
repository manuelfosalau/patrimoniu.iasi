<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calendarul evenimentelor din județul Iași</title>
<meta name="description" content="Calendar interactiv al festivalurilor și evenimentelor cu impact din județul Iași, ordonate pe luni, cu localizare pe hartă.">
<link rel="canonical" href="https://manuelfosalau.github.io/patrimoniu.iasi/evenimente.html">

<meta property="og:type" content="website">
<meta property="og:locale" content="ro_RO">
<meta property="og:site_name" content="Harta patrimoniului județului Iași">
<meta property="og:title" content="Calendarul evenimentelor din județul Iași">
<meta property="og:description" content="Festivalurile și evenimentele cu impact din județul Iași, luna cu luna.">
<meta property="og:url" content="https://manuelfosalau.github.io/patrimoniu.iasi/evenimente.html">
<meta property="og:image" content="https://manuelfosalau.github.io/patrimoniu.iasi/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#221F1C">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<a class="sari-la-continut" href="#lista-evenimente">Sari la lista evenimentelor</a>

<div id="aplicatie">
  <aside id="bara">
    <header id="antet">
      <h1>Calendarul evenimentelor</h1>
      <p>Festivaluri și manifestări din județul Iași</p>
    </header>

    <nav class="navigare" aria-label="Secțiuni">
      <a href="index.html">Hartă</a>
      <a href="evenimente.html" aria-current="page">Calendar</a>
      <a href="despre.html">Despre</a>
    </nav>

    <div id="luni" role="group" aria-label="Filtrare pe luni"></div>

    <div id="lista-evenimente"></div>

    <div id="subsol">
      <span><strong id="nr-evenimente">0</strong> evenimente</span>
      <span id="moment"></span>
    </div>
  </aside>

  <main id="harta" aria-label="Localizarea evenimentelor"></main>
</div>

<div id="stare" role="status">Se încarcă datele…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script>

function mesaj(text, esteEroare){
  const cutie = document.getElementById('stare');
  if (!text){ cutie.classList.add('ascuns'); return; }
  cutie.classList.remove('ascuns');
  cutie.classList.toggle('eroare', !!esteEroare);
  cutie.innerHTML = text;
}

const harta = L.map('harta', { zoomControl:false }).setView(CONFIG.centru, CONFIG.zoom);
L.control.zoom({ position:'bottomright' }).addTo(harta);
L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  { attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap', maxZoom:16 }).addTo(harta);

const stratEvenimente = L.layerGroup().addTo(harta);
const CULOARE_EVENIMENT = culoareCategorie('evenimente');

const stare = { evenimente:[], lunaAleasa:null, selectat:null };

/* ---------- pista anuală ---------- */

function pozitieInAn(data){
  const inceputAn = new Date(data.getFullYear(), 0, 1);
  const zile = (data - inceputAn) / 86400000;
  return Math.max(0, Math.min(100, (zile / 365) * 100));
}

function pistaHtml(p){
  const a = pozitieInAn(p.inceput);
  const b = pozitieInAn(p.sfarsit);
  const stanga = Math.min(a, b);
  const latime = Math.max(0.8, Math.abs(b - a));
  return `<span class="pista" aria-hidden="true"><i style="left:${stanga}%;width:${latime}%"></i></span>`;
}

/* ---------- interfață ---------- */

function deseneazaLuni(){
  const gazda = document.getElementById('luni');
  gazda.innerHTML = '';

  const perLuna = new Array(12).fill(0);
  stare.evenimente.forEach(e => luniAtinse(e._perioada).forEach(l => perLuna[l]++));

  const toate = document.createElement('button');
  toate.className = 'luna';
  toate.type = 'button';
  toate.textContent = 'Tot anul';
  toate.setAttribute('aria-pressed', stare.lunaAleasa === null);
  toate.addEventListener('click', () => { stare.lunaAleasa = null; deseneazaLuni(); deseneazaLista(true); });
  gazda.appendChild(toate);

  LUNI_SCURT.forEach((nume, i) => {
    const buton = document.createElement('button');
    buton.className = 'luna';
    buton.type = 'button';
    buton.innerHTML = `${nume}<span class="cnt">${perLuna[i]}</span>`;
    buton.setAttribute('aria-label', `${LUNI[i]}, ${perLuna[i]} evenimente`);
    buton.setAttribute('aria-pressed', stare.lunaAleasa === i);
    buton.disabled = perLuna[i] === 0;
    buton.addEventListener('click', () => {
      stare.lunaAleasa = (stare.lunaAleasa === i) ? null : i;
      deseneazaLuni();
      deseneazaLista(true);
    });
    gazda.appendChild(buton);
  });
}

function evenimenteVizibile(){
  if (stare.lunaAleasa === null) return stare.evenimente;
  return stare.evenimente.filter(e => luniAtinse(e._perioada).includes(stare.lunaAleasa));
}

function deseneazaLista(incadreaza){
  const gazda = document.getElementById('lista-evenimente');
  const lista = evenimenteVizibile();
  gazda.innerHTML = '';
  stratEvenimente.clearLayers();

  document.getElementById('nr-evenimente').textContent = lista.length;

  if (!lista.length){
    gazda.innerHTML = '<p class="gol">Nu există evenimente în luna selectată.</p>';
    return;
  }

  const limite = [];

  lista.forEach(e => {
    const card = document.createElement('button');
    card.className = 'eveniment';
    card.type = 'button';
    card.innerHTML =
      `<h3>${esc(e[COL.denumire])}</h3>
       <p class="loc">${esc(e[COL.uat] || '')}</p>
       <p class="data">${esc(formateazaPerioada(e._perioada))}</p>
       ${e[COL.descriere] ? `<p>${esc(e[COL.descriere])}</p>` : ''}
       ${pistaHtml(e._perioada)}`;

    const marcator = L.marker([e._lat, e._lon], {
      icon: L.divIcon({
        className:'ancora-pin',
        html:`<span class="pin" style="--c:${CULOARE_EVENIMENT}"></span>`,
        iconSize:[15,15], iconAnchor:[7.5,7.5], popupAnchor:[0,-9]
      }),
      title: e[COL.denumire] || '',
      alt: e[COL.denumire] || ''
    }).bindPopup(
      `<div class="pop" style="--c:${CULOARE_EVENIMENT}">
        <div class="pop-eticheta"><i></i>${esc(e._subcategorie)}</div>
        <h3>${esc(e[COL.denumire])}</h3>
        <p class="pop-uat">${esc(e[COL.uat] || '')}</p>
        <p><strong>${esc(formateazaPerioada(e._perioada))}</strong></p>
        ${e[COL.descriere] ? `<p>${esc(e[COL.descriere])}</p>` : ''}
      </div>`, { maxWidth:300, minWidth:280 });

    stratEvenimente.addLayer(marcator);
    limite.push(marcator.getLatLng());

    card.addEventListener('click', () => {
      document.querySelectorAll('.eveniment.selectat').forEach(x => x.classList.remove('selectat'));
      card.classList.add('selectat');
      harta.flyTo([e._lat, e._lon], 12, { duration:.6 });
      marcator.openPopup();
    });

    gazda.appendChild(card);
  });

  if (incadreaza && limite.length)
    harta.fitBounds(L.latLngBounds(limite), { padding:[50,50], maxZoom:11 });
}

/* ---------- pornire ---------- */

async function porneste(){
  mesaj('Se încarcă datele…');
  let rezultat;
  try {
    rezultat = await incarcaDate();
  } catch (err){
    mesaj(eroareIncarcare(err), true);
    return;
  }

  // Intră în calendar orice rând cu o perioadă lizibilă în coloana perioada
  stare.evenimente = rezultat.randuri
    .filter(r => r._perioada)
    .sort((a, b) => a._perioada.inceput - b._perioada.inceput);

  deseneazaLuni();
  deseneazaLista(true);

  document.getElementById('moment').textContent =
    `${rezultat.sursa}, ${new Date().toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'})}`;

  if (!stare.evenimente.length){
    mesaj('Niciun rând nu are o perioadă lizibilă. Completează coloana <code>perioada</code> ' +
          'în formatul <code>10.05-18.05</code> sau <code>15.08</code>.', true);
  } else {
    mesaj('');
  }
}

porneste();
</script>
</body>
</html>
