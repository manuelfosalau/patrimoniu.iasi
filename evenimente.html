/* Stilurile specifice acestui calendar. Stau aici ca să nu intre în
   conflict cu cele ale calendarului 2, care folosește stil.css. */

#sezoane{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;flex:none;
  background:var(--panou);border-bottom:1px solid var(--linie);
}
.sezon{
  border:0;border-right:1px solid var(--linie);background:none;cursor:pointer;

#randuri{flex:1;overflow-y:auto;padding:4px 28px 40px;min-height:0}

  display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;

.cercuri .gol-luna{font-size:13px;color:var(--cerneala-3);font-style:italic}

.cerc{
  flex:none;border-radius:50%;padding:0;cursor:pointer;
  background:var(--c);border:1.5px solid rgba(20,28,24,.28);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease;
}
/* denumirea scrisă în cercurile mari și foarte mari */
.cerc span{
  color:var(--t,#fff);text-align:center;word-break:break-word;hyphens:auto;
  display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none;
}
.cerc.m3 span{font:500 8px/1.12 var(--sans);-webkit-line-clamp:3;padding:0 6px}
.cerc.m4 span{font:500 9.5px/1.15 var(--sans);-webkit-line-clamp:4;padding:0 9px}
.cerc:hover,.cerc:focus-visible{transform:scale(1.14);box-shadow:0 3px 10px rgba(20,28,24,.25);z-index:2}
.cerc.ales{outline:2px solid var(--cerneala);outline-offset:2px}
.cerc.m1{width:16px;height:16px}
.cerc.m2{width:26px;height:26px}
.cerc.m3{width:48px;height:48px}
.cerc.m4{width:72px;height:72px}
.cerc.m0{width:16px;height:16px;background:transparent;border:2px dashed var(--c)}

/* legenda plutește în colțul din dreapta jos, peste zona evenimentelor */
#continut{position:relative}
.legenda{
  position:absolute;right:18px;bottom:18px;z-index:5;
  background:var(--panou);border:1px solid var(--linie-tare);
  box-shadow:0 3px 14px rgba(20,28,24,.12);padding:11px 16px 12px;
}
.legenda h3{font-size:13.5px;margin-bottom:9px;line-height:1.2}
.legenda-cercuri{display:flex;align-items:flex-end;gap:16px}
.legenda-rand{display:flex;flex-direction:column;align-items:center;gap:6px;
              font-size:11px;color:var(--cerneala-2);white-space:nowrap}
.legenda-rand i{
  display:block;border-radius:50%;background:#C9CEC6;border:1.5px solid rgba(20,28,24,.28);
}
.legenda-rand i.necunoscut{background:none;border:2px dashed #9AA39D}

/* loc liber sub ultimul rând, ca să poată fi derulat de sub legendă */
#randuri{padding-bottom:150px!important}

/* butonul de selectare totală, lângă titlul filtrului */
.cap-filtru{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:3px 0}
.toate-niciuna{
  border:0;background:none;padding:0;cursor:pointer;
  font:400 12px var(--sans);color:var(--focus);white-space:nowrap;
}

/* eticheta de la hover */

}
#eticheta[hidden]{display:none}

/* fișa de detalii */
#fisa{
  position:fixed;z-index:1300;width:340px;max-width:calc(100vw - 24px);
  background:var(--panou);box-shadow:0 10px 36px rgba(20,28,24,.24);

}

#fisa .cap{padding:16px 44px 12px 18px;border-bottom:1px solid var(--linie);background:var(--c-fond)}

@media (max-width:860px){

<script>

/* ==========================================================================
   CONFIGURAREA CALENDARULUI
   Legătura cu fila de evenimente și numele coloanelor.
   ========================================================================== */

const TEST = {
  url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2m0ob7kRyIJ5fmf5hqKHYnie_Yd9Pn1NE9gGKitelBxfQQVxA74ndZ31_q0ulpVn16dbsxdZtWr7N/pub?gid=262696074&single=true&output=csv',

  // Numele exacte ale coloanelor din tabel
  coloane: {
    sursa:        ['Sursă'],
    nume:         ['Nume eveniment'],
    luna:         ['Luna'],
    sezon:        ['Sezon'],
    perioada:     ['Perioadă'],
    localitate:   ['Localitate'],
    mediu:        ['Mediu'],
    categorie:    ['A. Categorie tematică'],
    anvergura:    ['B. Anvergură'],
    rol:          ['C. Rol turistic'],
    tip:          ['D. Tip eveniment'],
    participanti: ['Participanți (orientativ)'],
    organizator:  ['Organizator'],
    link:         ['Link'],
    activ:        ['Activ']
  },

  // Pragurile de mărime pentru cercuri
  praguri: [100, 1000, 5000],

  // Culori pentru categoriile care nu apar în FESTIVALURI.categorii.
  // Se împart în ordine, câte una pe categorie, deci nu se pot repeta.
  culoriSuplimentare: ['#0F8C8C','#A0522D','#4C5FAF','#B03A7E','#6E8C2C',
                       '#8A6BBF','#C2571A','#2E7D6B','#7A6A2E','#5C6B8A'],

  sezoane: [
    { cheie:'iarna',     eticheta:'Iarnă',     luni:[12,1,2] },
    { cheie:'primavara', eticheta:'Primăvară', luni:[3,4,5] },
    { cheie:'vara',      eticheta:'Vară',      luni:[6,7,8] },
    { cheie:'toamna',    eticheta:'Toamnă',    luni:[9,10,11] }
  ]
};


/* ==========================================================================
   Citirea valorilor
   ========================================================================== */

function mesaj(text, esteEroare){
  const cutie = document.getElementById('stare');
  if (!text){ cutie.classList.add('ascuns'); return; }
  cutie.classList.remove('ascuns');
  cutie.classList.toggle('eroare', !!esteEroare);
  cutie.innerHTML = text;
}

// Leagă fiecare câmp de antetul real din tabel. Normalizăm ambele părți,
// deci cheile se pot scrie oricum: cu diacritice, majuscule sau fără.
function hartaColoane(antete){
  const rezultat = {};
  const folosite = new Set();
  const norm = antete.map(a => ({ brut:a, n:fara(a) }));

  for (const [camp, chei] of Object.entries(TEST.coloane)){
    let gasit = null;
    for (const cheieBruta of chei){
      const cheie = fara(cheieBruta);
      if (!cheie) continue;
      gasit = norm.find(a => !folosite.has(a.brut) && a.n === cheie)
           || norm.find(a => !folosite.has(a.brut) && a.n.includes(cheie));
      if (gasit) break;
    }
    if (gasit){ rezultat[camp] = gasit.brut; folosite.add(gasit.brut); }
  }
  return rezultat;
}

// Găsește rândul de antet printre primele rânduri: cel în care se
// recunosc cele mai multe coloane. Ocolește titluri sau rânduri goale de sus.
function gasesteAntet(randuri){
  let celMaiBun = 0, scor = -1;
  const limita = Math.min(randuri.length, 15);
  for (let i = 0; i < limita; i++){
    const potriviri = Object.keys(hartaColoane(randuri[i].map(c => (c || '').toString().trim()))).length;
    if (potriviri > scor){ scor = potriviri; celMaiBun = i; }
  }
  return celMaiBun;
}

// „1.000”, „~500”, „1000-5000”, „peste 5.000”, „1,5 mii”, „2k”
function parseParticipanti(text){
  if (!text) return null;
  let t = fara(text).replace(/\s+/g, '');
  if (!t) return null;
  const mii = /mii|\dk/.test(t);
  t = t.replace(/(\d)\.(?=\d{3}(?!\d))/g, '$1');         // separatorul de mii
  const numere = (t.match(/\d+(?:[.,]\d+)?/g) || [])
                   .map(n => parseFloat(n.replace(',', '.')) * (mii ? 1000 : 1));
  if (!numere.length) return null;
  if (/peste|>|minim|min\./.test(t)) return Math.max(...numere) + 1;
  if (/sub|<|maxim|max\./.test(t))   return Math.max(...numere) - 1;
  if (numere.length >= 2) return (numere[0] + numere[1]) / 2;
  return numere[0];
}

function clasaMarime(n){
  if (n === null || !isFinite(n)) return 0;
  const [a, b, c] = TEST.praguri;
  if (n < a) return 1;
  if (n < b) return 2;
  if (n <= c) return 3;
  return 4;
}

// „1”, „01”, „1, 2”, „ianuarie”, „ian-feb”
function parseLuni(text){
  if (!text) return [];
  const luni = new Set();
  text.toString().split(/[,;\/\s]+|[-–—]/).forEach(bucata => {
    const b = bucata.trim();
    if (!b) return;
    const n = parseInt(b, 10);
    if (String(n) === b.replace(/^0+/, '') && n >= 1 && n <= 12){ luni.add(n); return; }
    const i = indexLuna(b);
    if (i >= 0) luni.add(i + 1);
  });
  return [...luni];
}

function parseSezon(text){
  const t = fara(text);
  if (!t) return null;
  // „primavara” conține „vara”, deci o verificăm prima
  if (t.includes('primavar')) return 'primavara';
  if (t.includes('iarn'))     return 'iarna';
  if (t.includes('toamn'))    return 'toamna';
  if (t.includes('vara'))     return 'vara';
  return null;
}

// „2. Religie și pelerinaj”, „6) Sport…”, „8 - Sărbători…” pierd numărul din față
function faraNumerotare(text){
  return (text || '').toString().replace(/^\s*\d+\s*[.)\-–:]\s*/, '').trim();
}

// Numărul din față, păstrat doar pentru ordonare: „2. Religie” → 2
function numarInitial(text){
  const m = (text || '').toString().match(/^\s*(\d+)\s*[.)\-–:]/);
  return m ? parseInt(m[1], 10) : 999;
}

// Text alb pe culori închise, text închis pe culori deschise (galben, ocru)
function culoareText(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return '#fff';
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  const lum = .2126 * r + .7152 * g + .0722 * b;
  return lum > .32 ? '#1B2320' : '#fff';
}

function inactiv(text){
  return ['nu','0','inactiv','false','anulat'].includes(fara(text));
}

function linkComplet(url){
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url.replace(/^\/+/, '');
}


/* ==========================================================================
   Starea paginii
   ========================================================================== */

const stare = {
  toate: [],
  sezon: null,
  surse: new Set(),
  categorii: new Set(),
  roluri: new Set(),
  cautare: '',
  ales: null
};

async function incarca(){
  const raspuns = await fetch(faraCache(TEST.url));
  if (!raspuns.ok) throw new Error('HTTP ' + raspuns.status);
  const text = (await raspuns.text()).replace(/^\uFEFF/, '');

  // citim fără antet, apoi alegem noi rândul care arată ca un antet
  const brut = Papa.parse(text.trim(), { header:false, skipEmptyLines:true }).data;
  const iAntet = gasesteAntet(brut);
  const antete = (brut[iAntet] || []).map(c => (c || '').toString().trim());
  const C = hartaColoane(antete);

  const date = brut.slice(iAntet + 1).map(rand => {
    const o = {};
    antete.forEach((a, j) => { if (a) o[a] = rand[j]; });
    return o;
  });
  const parsat = { data: date };
  const v = (r, camp) => (C[camp] ? (r[C[camp]] || '').toString().trim() : '');

  const evenimente = [];
  parsat.data.forEach((r, i) => {
    const nume = v(r, 'nume');
    if (!nume) return;
    if (inactiv(v(r, 'activ'))) return;

    const catText = faraNumerotare(v(r, 'categorie'));
    const cat = potrivesteCategorie(catText);
    const rolText = faraNumerotare(v(r, 'rol')) || 'Nespecificat';
    let luni = parseLuni(v(r, 'luna'));
    if (!luni.length){
      const p = parsePerioada(v(r, 'perioada'));
      if (p) luni = [p.inceput.getMonth() + 1];
    }
    const p = parsePerioada(v(r, 'perioada'));
    const participanti = parseParticipanti(v(r, 'participanti'));

    evenimente.push({
      id: i,
      nume,
      luni,
      sezon: parseSezon(v(r, 'sezon')),
      ziInceput: p ? p.inceput.getDate() : 99,
      sursa: v(r, 'sursa') || 'Nespecificat',
      categorie: cat.eticheta,
      culoare: cat.culoare,
      ordineCategorie: numarInitial(v(r, 'categorie')),
      rol: rolText,
      ordineRol: numarInitial(v(r, 'rol')),
      participanti,
      marime: clasaMarime(participanti),
      campuri: {
        'Perioadă':      v(r, 'perioada'),
        'Localitate':    v(r, 'localitate'),
        'Mediu':         v(r, 'mediu'),
        'Categorie':     catText,
        'Anvergură':     v(r, 'anvergura'),
        'Rol turistic':  faraNumerotare(v(r, 'rol')),
        'Tip eveniment': v(r, 'tip'),
        'Participanți':  v(r, 'participanti'),
        'Organizator':   v(r, 'organizator'),
        'Sursă':         v(r, 'sursa')
      },
      link: linkComplet(v(r, 'link')),
      _text: fara(`${nume} ${v(r,'localitate')} ${v(r,'organizator')} ${v(r,'categorie')}`)
    });
  });

  // categoriile care nu au culoare fixă primesc câte una distinctă, în ordine alfabetică
  const cunoscute = new Set(FESTIVALURI.categorii.map(c => c.eticheta));
  const ocupate = new Set(FESTIVALURI.categorii.map(c => c.culoare.toLowerCase()));
  const libere = TEST.culoriSuplimentare.filter(c => !ocupate.has(c.toLowerCase()));
  const noi = [...new Set(evenimente.filter(e => !cunoscute.has(e.categorie))
                                    .map(e => e.categorie))].sort(cmp);
  const atribuite = new Map(noi.map((c, i) => [c, libere[i % libere.length]]));
  evenimente.forEach(e => { if (atribuite.has(e.categorie)) e.culoare = atribuite.get(e.categorie); });

  const lipsa = Object.keys(TEST.coloane).filter(k => !C[k]);
  return { evenimente, lipsa, antete, randAntet: iAntet + 1 };
}


/* ==========================================================================
   Filtre
   ========================================================================== */

function trece(e){
  if (!stare.surse.has(e.sursa)) return false;
  if (!stare.categorii.has(e.categorie)) return false;
  if (!stare.roluri.has(e.rol)) return false;
  if (stare.cautare && !e._text.includes(stare.cautare)) return false;
  return true;
}

function inSezon(e, sezon){
  if (e.luni.length) return e.luni.some(l => sezon.luni.includes(l));
  return e.sezon === sezon.cheie;
}

function deseneazaSurse(){
  const gazda = document.getElementById('surse');
  gazda.innerHTML = '';
  [...new Set(stare.toate.map(e => e.sursa))].sort(cmp).forEach(s => {
    const b = document.createElement('button');
    b.className = 'buton comutator';
    b.type = 'button';
    b.textContent = s;
    b.setAttribute('aria-pressed', stare.surse.has(s));
    b.addEventListener('click', () => {
      stare.surse.has(s) ? stare.surse.delete(s) : stare.surse.add(s);
      if (!stare.surse.size) stare.surse.add(s);
      deseneazaSurse();
      deseneazaTot();
    });
    gazda.appendChild(b);
  });
}

// Construiește un bloc de filtru cu bife și buton de selectare totală.
// `camp` e proprietatea evenimentului, `cheieStare` mulțimea din stare.
function blocFiltru(titlu, camp, cheieStare, campOrdine, colorat){
  const numar = new Map(), culori = new Map(), ordine = new Map();
  stare.toate.forEach(e => {
    const val = e[camp];
    numar.set(val, (numar.get(val) || 0) + 1);
    culori.set(val, e.culoare);
    ordine.set(val, Math.min(ordine.get(val) ?? 999, e[campOrdine] ?? 999));
  });

  // ordonăm după numărul din tabel, apoi alfabetic
  const valori = [...numar.keys()].sort((a, b) => (ordine.get(a) - ordine.get(b)) || cmp(a, b));
  const toateBifate = () => valori.every(x => stare[cheieStare].has(x));

  const bloc = document.createElement('div');
  bloc.className = 'categorie';
  bloc.innerHTML =
    `<div class="cap-filtru">
       <span class="nume-categorie">${esc(titlu)}</span>
       <button class="toate-niciuna" type="button"></button>
     </div>`;
  const buton = bloc.querySelector('.toate-niciuna');
  const actualizeazaButon = () => {
    buton.textContent = toateBifate() ? 'Deselectează tot' : 'Selectează tot';
  };
  actualizeazaButon();

  buton.addEventListener('click', () => {
    stare[cheieStare] = toateBifate() ? new Set() : new Set(valori);
    inchideFisa();
    deseneazaFiltre();
    deseneazaTot();
  });

  const lista = document.createElement('div');
  lista.className = 'subcategorii';

  valori.forEach(val => {
    const rand = document.createElement('label');
    rand.className = 'subcategorie';
    const stil = colorat ? `style="color:${culori.get(val)};font-weight:500"` : '';
    rand.innerHTML =
      `<input type="checkbox" ${stare[cheieStare].has(val) ? 'checked' : ''}>
       <span ${stil}>${esc(val)}</span>
       <span class="numar">${numar.get(val)}</span>`;
    rand.querySelector('input').addEventListener('change', ev => {
      ev.target.checked ? stare[cheieStare].add(val) : stare[cheieStare].delete(val);
      actualizeazaButon();
      inchideFisa();
      deseneazaTot();
    });
    lista.appendChild(rand);
  });

  bloc.appendChild(lista);
  return bloc;
}

function deseneazaFiltre(){
  const gazda = document.getElementById('filtre');
  gazda.innerHTML = '';
  gazda.appendChild(blocFiltru('Categorie tematică', 'categorie', 'categorii', 'ordineCategorie', true));
  gazda.appendChild(blocFiltru('Rol turistic',       'rol',       'roluri',    'ordineRol',       false));
}

function deseneazaSezoane(){
  const gazda = document.getElementById('sezoane');
  gazda.innerHTML = '';
  const baza = stare.toate.filter(trece);

  TEST.sezoane.forEach(s => {
    const n = baza.filter(e => inSezon(e, s)).length;
    const luniText = s.luni.map(l => LUNI_SCURT[l - 1]).join(' · ');
    const b = document.createElement('button');
    b.className = 'sezon';
    b.type = 'button';
    b.setAttribute('aria-pressed', stare.sezon === s.cheie);
    b.innerHTML = `<b>${s.eticheta}</b><span>${luniText} · <span class="cnt">${n}</span></span>`;
    b.addEventListener('click', () => { stare.sezon = s.cheie; inchideFisa(); deseneazaTot(); });
    gazda.appendChild(b);
  });
}


/* ==========================================================================
   Rândurile cu cercuri
   ========================================================================== */

function cercHtml(e){
  const titlu = e.nume + (e.participanti !== null ? ` · ${e.campuri['Participanți']} participanți` : '');
  const text = e.marime >= 3 ? `<span aria-hidden="true">${esc(e.nume)}</span>` : '';
  return `<button class="cerc m${e.marime}${stare.ales === e.id ? ' ales' : ''}" type="button"
            style="--c:${e.culoare};--t:${culoareText(e.culoare)}" data-id="${e.id}"
            aria-label="${esc(titlu)}">${text}</button>`;
}

function ordine(a, b){
  return a.ziInceput - b.ziInceput || b.marime - a.marime || cmp(a.nume, b.nume);
}

function deseneazaRanduri(){
  const gazda = document.getElementById('randuri');
  const sezon = TEST.sezoane.find(s => s.cheie === stare.sezon);
  const vizibile = stare.toate.filter(e => trece(e) && inSezon(e, sezon));

  let html = '';
  sezon.luni.forEach(l => {
    const dinLuna = vizibile.filter(e => e.luni.includes(l)).sort(ordine);
    html += `<section class="rand-luna">
      <h2>${LUNI[l - 1][0].toUpperCase() + LUNI[l - 1].slice(1)}
        <small>${dinLuna.length} ${dinLuna.length === 1 ? 'eveniment' : 'evenimente'}</small></h2>
      <div class="cercuri">${dinLuna.length ? dinLuna.map(cercHtml).join('')
                                            : '<span class="gol-luna">niciun eveniment</span>'}</div>
    </section>`;
  });

  // evenimente cu sezon, dar fără lună precizată
  const fara = vizibile.filter(e => !e.luni.length).sort(ordine);
  if (fara.length){
    html += `<section class="rand-luna nedatat">
      <h2>Lună neprecizată<small>${fara.length} în acest sezon</small></h2>
      <div class="cercuri">${fara.map(cercHtml).join('')}</div>
    </section>`;
  }

  gazda.innerHTML = html;
  document.getElementById('nr-evenimente').textContent = vizibile.length;

  gazda.querySelectorAll('.cerc').forEach(c => {
    const e = stare.toate.find(x => x.id === +c.dataset.id);
    c.addEventListener('mouseenter', () => aratEticheta(c, e));
    c.addEventListener('mouseleave', ascundeEticheta);
    c.addEventListener('focus',      () => aratEticheta(c, e));
    c.addEventListener('blur',       ascundeEticheta);
    c.addEventListener('click', ev => { ev.stopPropagation(); ascundeEticheta(); deschideFisa(c, e); });
  });
}

function deseneazaTot(){
  deseneazaSezoane();
  deseneazaRanduri();
}


/* ==========================================================================
   Eticheta de la hover și fișa de detalii
   ========================================================================== */

const eticheta = document.getElementById('eticheta');

function aratEticheta(cerc, e){
  const r = cerc.getBoundingClientRect();
  eticheta.textContent = e.nume;
  eticheta.style.left = (r.left + r.width / 2) + 'px';
  eticheta.style.top = r.top + 'px';
  eticheta.hidden = false;
}
function ascundeEticheta(){ eticheta.hidden = true; }

const fisa = document.getElementById('fisa');

function deschideFisa(cerc, e){
  stare.ales = e.id;
  document.querySelectorAll('.cerc.ales').forEach(x => x.classList.remove('ales'));
  cerc.classList.add('ales');

  fisa.style.setProperty('--c', e.culoare);
  fisa.style.setProperty('--c-fond', tenta(e.culoare, '12'));
  document.getElementById('fisa-categorie').textContent = e.categorie;
  document.getElementById('fisa-titlu').textContent = e.nume;

  const dl = Object.entries(e.campuri)
    .filter(([, val]) => val)
    .map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`);
  if (e.link) dl.push(`<dt>Link</dt><dd><a href="${esc(e.link)}" target="_blank" rel="noopener">pagina evenimentului</a></dd>`);
  document.getElementById('fisa-detalii').innerHTML = dl.join('');

  fisa.hidden = false;

  // o așezăm lângă cerc, întorcând-o dacă ar ieși din ecran
  const r = cerc.getBoundingClientRect();
  const lat = fisa.offsetWidth, inalt = fisa.offsetHeight;
  let stanga = r.right + 14;
  if (stanga + lat > window.innerWidth - 12) stanga = r.left - lat - 14;
  if (stanga < 12) stanga = 12;
  let sus = r.top + r.height / 2 - inalt / 2;
  sus = Math.max(12, Math.min(sus, window.innerHeight - inalt - 12));
  fisa.style.left = stanga + 'px';
  fisa.style.top = sus + 'px';

  fisa.querySelector('.inchide').focus({ preventScroll:true });
}

function inchideFisa(){
  fisa.hidden = true;
  stare.ales = null;
  document.querySelectorAll('.cerc.ales').forEach(x => x.classList.remove('ales'));
}

fisa.querySelector('.inchide').addEventListener('click', inchideFisa);
fisa.addEventListener('click', ev => ev.stopPropagation());
document.addEventListener('click', () => { if (!fisa.hidden) inchideFisa(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') inchideFisa(); });
document.getElementById('randuri').addEventListener('scroll', () => { ascundeEticheta(); inchideFisa(); });
window.addEventListener('resize', () => { ascundeEticheta(); inchideFisa(); });

document.getElementById('cautare').addEventListener('input', ev => {
  stare.cautare = fara(ev.target.value);
  inchideFisa();
  deseneazaTot();
});


/* ==========================================================================
   Pornire
   ========================================================================== */

(async function porneste(){
  mesaj('Se încarcă datele…');
  let rezultat;
  try {
    rezultat = await incarca();
  } catch (err){
    mesaj(eroareIncarcare(err), true);
    return;
  }

  stare.toate = rezultat.evenimente;
  stare.surse = new Set(stare.toate.map(e => e.sursa));
  stare.categorii = new Set(stare.toate.map(e => e.categorie));
  stare.roluri = new Set(stare.toate.map(e => e.rol));

  // pornim pe sezonul curent, dacă are evenimente, altfel pe primul care are
  const lunaAzi = new Date().getMonth() + 1;
  const curent = TEST.sezoane.find(s => s.luni.includes(lunaAzi));
  const cuEvenimente = s => stare.toate.some(e => inSezon(e, s));
  stare.sezon = (cuEvenimente(curent) ? curent : (TEST.sezoane.find(cuEvenimente) || curent)).cheie;

  deseneazaSurse();
  deseneazaFiltre();
  deseneazaTot();

  document.getElementById('moment').textContent =
    new Date().toLocaleTimeString('ro-RO', { hour:'2-digit', minute:'2-digit' });

  const fara = stare.toate.filter(e => !e.luni.length && !e.sezon).length;
  const necunoscuti = stare.toate.filter(e => e.participanti === null).length;
  const note = [];
  if (rezultat.lipsa.length){
    const vazute = rezultat.antete.filter(Boolean).slice(0, 8).map(esc).join(' | ');
    note.push(`Coloane negăsite: <code>${rezultat.lipsa.join(', ')}</code>. ` +
              `Antetul citit (rândul ${rezultat.randAntet}): <code>${vazute || 'gol'}</code>`);
    console.log('Antet citit:', rezultat.antete);
  }
  if (fara) note.push(`${fara} evenimente nu au nici lună, nici sezon, și nu apar în niciun sezon.`);
  if (necunoscuti) note.push(`${necunoscuti} evenimente au participanți nelizibili și apar ca cercuri punctate.`);

  if (note.length){
    mesaj(note.join(' '), !!rezultat.lipsa.length);
    if (!rezultat.lipsa.length) setTimeout(() => mesaj(''), 11000);
  } else {
    mesaj('');
  }
})();
</script>
